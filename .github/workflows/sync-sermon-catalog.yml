name: Sync sermon catalog

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sermon-catalog-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the app
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Read the ministry archive
        run: node scripts/update-sermon-catalog.mjs

      - name: Commit catalog additions
        run: |
          if git diff --quiet -- public/sermons.json; then
            echo "The sermon catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sermons.json
          git commit -m "Update sermon archive catalog"
          git push
